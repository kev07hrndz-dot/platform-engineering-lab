# Optional local test client; intentionally excluded from the application base.
# Its own ServiceAccount gives it a workload identity that a service mesh can
# authorize (UDS Core); the label is what plain NetworkPolicy selects on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-client
  namespace: platform-lab
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-client
  namespace: platform-lab
  labels:
    platform-lab-client: "true"
spec:
  serviceAccountName: lab-client
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/os: linux
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: docker.io/curlimages/curl:8.21.0
      imagePullPolicy: IfNotPresent
      command: [sleep, "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
