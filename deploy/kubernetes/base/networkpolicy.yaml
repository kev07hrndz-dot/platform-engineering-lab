apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-client-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-engineering-lab
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              platform-lab-client: "true"
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-client-egress
spec:
  podSelector:
    matchLabels:
      platform-lab-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-engineering-lab
      ports:
        - protocol: TCP
          port: 8000
