kind: ZarfPackageConfig
metadata:
  name: platform-engineering-lab
  description: Hardened FastAPI service with restricted pod security and default-deny networking
  version: 0.1.0

components:
  # Flavor "standalone": hand-written default-deny NetworkPolicies (any cluster).
  - name: platform-engineering-lab
    description: API Deployment, internal Service, restricted namespace, and NetworkPolicies
    required: true
    only:
      flavor: standalone
    images:
      - platform-engineering-lab:0.1.0
    manifests:
      - name: platform-engineering-lab
        namespace: platform-lab
        kustomizations:
          - overlay

  # Flavor "uds": the UDS Package CR declares network intent and the UDS
  # Operator generates the policies and the tenant-gateway route.
  - name: platform-engineering-lab
    description: API Deployment, internal Service, restricted namespace, and the UDS Package CR
    required: true
    only:
      flavor: uds
    images:
      - platform-engineering-lab:0.1.0
    manifests:
      - name: platform-engineering-lab
        namespace: platform-lab
        kustomizations:
          - ../uds/overlay
      - name: platform-engineering-lab-uds-package
        namespace: platform-lab
        files:
          - ../uds/package.yaml

  # Flavor "release": the image published to a registry, pinned by digest.
  # Built by the release workflow: scripts/release-overlay.sh writes the overlay
  # and APP_IMAGE is passed with `zarf package create --set`.
  - name: platform-engineering-lab
    description: API Deployment, internal Service, restricted namespace, and NetworkPolicies
    required: true
    only:
      flavor: release
    images:
      - "###ZARF_PKG_TMPL_APP_IMAGE###"
    manifests:
      - name: platform-engineering-lab
        namespace: platform-lab
        kustomizations:
          - release-overlay

  - name: smoke-client
    description: Optional labeled curl pod used to prove allowed and denied network paths
    required: false
    images:
      - docker.io/curlimages/curl:8.21.0
    manifests:
      - name: smoke-client
        namespace: platform-lab
        files:
          - ../kubernetes/smoke-client.yaml
