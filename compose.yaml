services:
  api:
    build: .
    image: platform-engineering-lab:dev
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
